<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TeleVideo Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 440px phone column; sticky title bar + ticker, feed of cards, bottom sheets for every flow. Dark-first, Telegram-blue accent. */
:root{
  --bg:#0b0e14;--surface:#141923;--surface2:#1c2230;--line:#283044;
  --fg:#eaeef7;--mute:#8e98b1;--accent:#2aabee;--on-accent:#04141f;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;
  --a2:#ff5fa2;--a3:#ffb020;--a4:#8b7bff;
  --t1:#4cc3ff;--t2:#ff7ab8;--t3:#ffc24d;--t4:#b0a3ff;--t5:#5eead4;
  --btn1:#1b8fdc;--btn2:#6a55f2;--btn3:#e4387f;--edge:#2a1c63;
  --grad:linear-gradient(135deg,var(--btn1),var(--btn2) 55%,var(--btn3));
  --shadow:0 18px 50px rgba(0,0,0,.5);--scrim:rgba(4,6,10,.72);
  --fd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --fb:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --fm:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef1f6;--surface:#ffffff;--surface2:#e8ecf4;--line:#d6dce8;
  --fg:#121726;--mute:#5b6680;--accent:#0a7fc2;--on-accent:#ffffff;
  --good:#0f9f6e;--warn:#b7791f;--bad:#d64545;--a2:#e0357f;--a3:#d98a00;--a4:#6a4cf0;--t1:#0a7fc2;--t2:#d02a76;--t3:#a85a00;--t4:#5b3de0;--t5:#0b8f7a;
  --shadow:0 18px 50px rgba(20,30,60,.2);--scrim:rgba(10,15,30,.45);color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f6;--surface:#ffffff;--surface2:#e8ecf4;--line:#d6dce8;
  --fg:#121726;--mute:#5b6680;--accent:#0a7fc2;--on-accent:#ffffff;
  --good:#0f9f6e;--warn:#b7791f;--bad:#d64545;--a2:#e0357f;--a3:#d98a00;--a4:#6a4cf0;--t1:#0a7fc2;--t2:#d02a76;--t3:#a85a00;--t4:#5b3de0;--t5:#0b8f7a;
  --shadow:0 18px 50px rgba(20,30,60,.2);--scrim:rgba(10,15,30,.45);color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .25s,color .25s;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--fd);text-wrap:balance}
.ic{width:18px;height:18px;flex:none}.ic.fill{fill:currentColor;stroke:none}
.shell{max-width:440px;margin:0 auto;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding-bottom:6px}
.top{display:flex;align-items:center;gap:12px;padding:12px 0 8px}
.tt{min-width:0;flex:1}
.tt h1{font-size:21px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.subl{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:12px;margin-top:4px;flex-wrap:wrap}
.fl{display:inline-flex;align-items:center;gap:5px;min-width:0}.fl .ic{width:14px;height:14px}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--surface2);color:var(--mute);white-space:nowrap}
.badge.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.badge.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.badge.acc{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.avatar{width:42px;height:42px;border-radius:50%;border:2px solid var(--accent);background:var(--surface2);overflow:hidden;display:grid;place-items:center;font:700 16px var(--fd);padding:0;cursor:pointer;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.mq{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:5px 6px 5px 11px;color:var(--accent)}
.mq-v{flex:1;min-width:0;overflow:hidden;white-space:nowrap;color:var(--fg);font-size:13px;font-weight:500}
.mq-t{display:inline-block;padding-left:100%;animation:mq linear infinite}
.mq-t.paused{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-100%)}}
.icbtn{width:34px;height:34px;border-radius:50%;border:0;background:var(--surface2);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--mute)}
.icbtn.sm{width:28px;height:28px}.icbtn.sm .ic{width:13px;height:13px}
main{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.search{position:relative;display:block}
.search .ic{position:absolute;left:13px;top:12px;color:var(--mute);pointer-events:none}
.search .in{padding-left:38px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px}
.tabs button{border:0;background:none;border-radius:10px;padding:9px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.sec{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);font-weight:700;margin-top:4px}
.feed{display:flex;flex-direction:column;gap:14px}
.vc{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:rise .25s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.media{position:relative;width:100%;max-width:100%;background:var(--surface2);overflow:hidden;display:block;border:0;padding:0;cursor:pointer}
.media>img,.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.art{display:grid;place-items:center}.art svg{width:46px;height:46px;color:#fff;opacity:.92;filter:drop-shadow(0 2px 8px rgba(0,0,0,.35))}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.74);color:#fff;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.ulk{position:absolute;left:8px;top:8px}
.vb{padding:12px;display:flex;flex-direction:column;gap:10px}
.vb h3{font-size:15px;font-weight:700;line-height:1.3}
.vb p{margin:2px 0 0;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vr .sp{flex:1}
.dl{color:var(--mute);font-size:12px;display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}.dl .ic{width:13px;height:13px}
.empty{text-align:center;color:var(--mute);padding:44px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:16px}
.foot{text-align:center;color:var(--mute);font-size:12px;padding:22px 0}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:13px 22px;background:var(--accent);color:var(--on-accent);font-weight:700;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);border-radius:12px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;min-height:40px;text-decoration:none;transition:transform .08s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.w{width:100%}.btn.sm{padding:5px 11px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
:is(.btn,.icbtn,.avatar,.fab,.tabs button,.tg,.lnk,.dayc):focus-visible,.in:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--fg);font:15px var(--fb);min-height:42px}
.in:focus{border-color:var(--accent)}
textarea.in{min-height:78px;resize:vertical}
.lbl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:5px}
.hint{color:var(--mute);font-size:12px;margin:0}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.pad{padding:16px}.stack{display:flex;flex-direction:column;gap:14px}.stack.t{gap:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g2>*,.g3>*{min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:7px 4px;font-size:12.5px;font-weight:600;color:var(--mute);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.tg{position:relative;width:44px;height:26px;border-radius:99px;border:0;background:var(--line);cursor:pointer;flex:none;padding:0;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tg[aria-checked="true"]{background:var(--accent)}.tg[aria-checked="true"]::after{transform:translateX(18px)}
.trow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0}
.trow+.trow{border-top:1px solid var(--line)}.trow b{font-weight:600;font-size:14px}.trow small{display:block;color:var(--mute);font-size:12px}
/* overlays */
#layer{position:relative;z-index:50}
.ov{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px);animation:fade .18s}
.ov.out{opacity:0;transition:opacity .15s}
.scrim{position:absolute;inset:0;background:var(--scrim);backdrop-filter:blur(3px)}
.sheet{position:relative;width:100%;max-width:440px;max-height:92%;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;box-shadow:var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px);animation:sheet .26s cubic-bezier(.2,.8,.2,1)}
.ov.full .sheet{height:94%}
@keyframes sheet{from{transform:translateY(36px);opacity:0}}@keyframes fade{from{opacity:0}}
@media (min-width:560px){.ov{align-items:center}.sheet{border-bottom:1px solid var(--line);border-radius:24px;max-height:88%}.ov.full .sheet{height:88%}}
.shead{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.shead h2{font-size:17px;font-weight:700}.hr{display:flex;gap:8px;align-items:center}
.sbody{padding:16px;display:flex;flex-direction:column;gap:14px}
.mini{display:flex;gap:12px;align-items:center;padding:8px}
.mini .th{width:96px;flex:none;border-radius:10px;overflow:hidden;position:relative;aspect-ratio:16/9}
.mini .th>img,.mini .th .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mini .th .art svg{width:24px;height:24px}
.mini b{font-size:14px;display:block;line-height:1.3}.mini span{color:var(--mute);font-size:12px}
.prog{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-weight:500;font-size:14px}
.steps li.cur{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.steps li.ok{border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 9%,var(--surface))}
.steps li.next{opacity:.55}
.sn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--mute);font-size:12px;font-weight:700;flex:none}
.ok .sn{background:var(--good);color:#04140d}.cur .sn{background:var(--accent);color:var(--on-accent)}
.steps .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.partner{border:1px dashed var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.plink{display:flex;gap:8px;align-items:center;color:var(--accent);font-family:var(--fm);font-size:12px;word-break:break-all}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px}
.linkbox a{flex:1;min-width:0;color:var(--accent);font-size:13px;word-break:break-all}
video{width:100%;border-radius:12px;background:#000}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:14px}.stat .n{font:800 28px/1 var(--fd);font-variant-numeric:tabular-nums}.stat .l{color:var(--mute);font-size:12px;margin-top:4px}
.stat .ic{color:var(--accent);margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dayc{border:1px solid var(--line);background:var(--surface2);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);cursor:default;min-width:0}
.dayc small{font-size:10px}.dayc b{font-size:11px;color:inherit;font-variant-numeric:tabular-nums}
.dayc.got{background:color-mix(in srgb,var(--good) 14%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--good)}
.dayc.now{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);cursor:pointer;animation:pulse 1.6s infinite}
.pro{display:flex;gap:14px;align-items:center;padding:14px}
.pro .big{width:68px;height:68px;border-radius:50%;border:2px solid var(--accent);overflow:hidden;background:var(--surface2);display:grid;place-items:center;font:700 26px var(--fd);padding:0;cursor:pointer;position:relative;flex:none}
.pro .big img{width:100%;height:100%;object-fit:cover}
.pro .big em{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font:600 9px var(--fb);font-style:normal;padding:2px 0}
.pro .who{min-width:0;flex:1}.pro .who b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pro .who span.m{color:var(--mute);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis}
.row2{display:flex;gap:8px}.row2>.in{flex:1;min-width:0}
.atabs{position:sticky;top:53px;z-index:4;display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line);scrollbar-width:none}
.atabs button{flex:none;border:0;border-radius:99px;padding:7px 14px;background:var(--surface2);color:var(--mute);font-weight:600;font-size:12.5px;cursor:pointer}
.atabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.h3{font-size:15px;font-weight:700}
.imgp{display:flex;flex-direction:column;gap:8px}.imgp img{width:100%;border-radius:12px;display:block}
.pv{display:grid;place-items:center;background:var(--surface2);color:var(--mute);font-size:12px;border-radius:12px;overflow:hidden;max-width:100%}.pv img{width:100%;height:100%;object-fit:cover}
.mrow{display:flex;gap:10px;align-items:center;padding:8px}
.mrow .th{width:84px;flex:none;border-radius:8px;overflow:hidden;position:relative;aspect-ratio:16/9;background:var(--surface2)}
.mrow .th>img,.mrow .th .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mrow .th .art svg{width:20px;height:20px}
.mrow .i{flex:1;min-width:0}.mrow .i b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mrow .i span{font-size:11.5px;color:var(--mute)}
.mstat{padding:10px 4px;text-align:center}.mstat b{display:block;font:800 19px var(--fd);font-variant-numeric:tabular-nums}.mstat span{font-size:10.5px;color:var(--mute)}
.chan{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
/* login */
.login{max-width:400px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:56px 0 40px;position:relative}
.login .themebtn{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:0}
.logo{width:64px;height:64px;border-radius:20px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;margin:0 auto 6px}.logo .ic{width:30px;height:30px}
.login h1{text-align:center;font-size:30px;font-weight:800;letter-spacing:-.02em}
.login .sub{text-align:center;color:var(--mute);margin:0 0 12px;font-size:14px}
.otp{display:flex;gap:8px;justify-content:center}
.ob{flex:1;max-width:48px;min-width:0;height:56px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);text-align:center;font:700 22px var(--fd)}
.ob:focus{outline:none;border-color:var(--accent)}
.shake{animation:shake .35s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.demo{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);border-radius:12px;padding:10px 12px;font-size:12.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mono{font-family:var(--fm);font-weight:700;letter-spacing:.12em}
.err{color:var(--bad);font-size:13px;text-align:center;margin:0}
#toasts{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top,0px));z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--good);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);max-width:420px;animation:rise .2s}
.toast.err{border-left-color:var(--bad)}.toast.out{opacity:0;transition:opacity .2s}
.sp-art{aspect-ratio:16/9;display:grid;place-items:center;background:linear-gradient(135deg,#0f766e,#f59e0b);color:#fff;font:800 20px var(--fd);text-align:center;padding:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.mq-t{padding-left:0;overflow:hidden;text-overflow:ellipsis;max-width:100%}}

/* ===== v2: colorful + 3D ===== */
#bg3d{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
#bg3d i{position:absolute;border-radius:50%;opacity:.4;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55),transparent 20%),radial-gradient(circle at 50% 50%,var(--oc),transparent 68%);animation:orb 18s ease-in-out infinite alternate}
#bg3d i:nth-child(1){--oc:#2aabee;width:70vmax;height:70vmax;left:-26vmax;top:-32vmax}
#bg3d i:nth-child(2){--oc:#ff5fa2;width:54vmax;height:54vmax;right:-24vmax;top:20vh;animation-delay:-6s}
#bg3d i:nth-child(3){--oc:#ffb020;width:46vmax;height:46vmax;left:-20vmax;bottom:-24vmax;animation-delay:-11s}
#bg3d i:nth-child(4){--oc:#8b7bff;width:38vmax;height:38vmax;right:-12vmax;bottom:-18vmax;animation-delay:-3s}
@keyframes orb{to{transform:translate3d(6vmax,-5vmax,0) scale(1.12)}}
:root[data-theme="light"] #bg3d i{opacity:.3}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) #bg3d i{opacity:.3}}

/* ---------- task gateway ---------- */
function openTask(v){
  var phase='idle',left=0,tick=null,showLink=false,tot=total(v);
  var final=S.user.unlocked.indexOf(v.id)>-1;
  if(!final)v.views++;
  var el=overlay({onClose:function(){clearInterval(tick);renderFeed();}});
  function done(){return S.user.progress[v.id]||0;}
  function steps(){
    if(v.taskType==='telegram')return v.channels.map(function(c){return {label:'Join '+(c.name||'channel'),link:c.link||'https://t.me/example',cd:Math.min(v.countdown,10)};});
    var out=[];for(var i=0;i<v.taskCount;i++)out.push({label:'Partner task '+(i+1),link:(v.adLinks&&(v.adLinks[i]||v.adLinks[0]))||S.cfg.sponsor.url||'https://partner.example/offer-'+(i+1),cd:v.countdown});
    return out;
  }
  function complete(){if(S.user.unlocked.indexOf(v.id)<0){S.user.unlocked.push(v.id);S.user.tasksDone+=tot;S.user.points+=v.reward;}final=true;toast('All tasks complete. File unlocked, +'+v.reward+' points.');}

    var st=steps(),d=done(),cur=st[d],html='';
    var mini='<div class="card mini"><div class="th">'+thumbHTML(v)+'</div><div style="min-width:0"><b>'+esc(v.title)+'</b>'+(v.duration?'<span>'+esc(v.duration)+'</span>':'')+'</div></div>';

      var n=d+1,R=44,C=2*Math.PI*R;

      if(phase==='running'||phase==='done'){

      }else{

        if(S.user.skipTokens>0)html+='<button class="btn w" data-a="skip">'+ic('skip')+'Use a skip token ('+S.user.skipTokens+' left)</button>';
      }
    }else{
      var bt=v.buttons;
      html=mini+playerHTML(v)+(bt.download.enabled?'<a class="btn primary w" data-a="dl" href="'+esc(safeUrl(v.dest||v.sourceUrl))+'" target="_blank" rel="noopener">'+ic('download')+esc(bt.download.label||'Download')+'</a>':'');
      if(bt.telegram.enabled&&bt.telegram.url)html+='<a class="btn w" href="'+esc(safeUrl(bt.telegram.url))+'" target="_blank" rel="noopener">'+ic('send')+esc(bt.telegram.label||'Join Telegram')+'</a>';
      if(bt.share.enabled)html+='<div class="g2"><button class="btn" data-copy="'+esc(shareLink(v))+'">'+ic('share')+esc(bt.share.label||'Share')+'</button><button class="btn" data-copy="'+esc(shareLink(v))+'">'+ic('copy')+'Copy link</button></div>';
    }
    el.sheet.innerHTML=head(final?'File unlocked':'Unlock this file')+'<div class="sbody">'+html+'</div>';
  }
  function finish(){S.user.progress[v.id]=done()+1;phase='done';r();if(done()>=tot)complete();tick=setTimeout(function(){el.close();},1100);}
  el.addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a;if(a==='vplay'){var vp0=b.closest('.vp'),vv0=vp0&&vp0.querySelector('video');if(vv0){if(vv0.paused)vv0.play();else vv0.pause();}return;}var st=steps(),cur=st[done()];

var GL='.btn,.fab,.icbtn,.tabs button,.atabs button,.seg button,.avatar,.applogo,.pro .big',glQ=0;
function syncGlint(){var vw=Math.max(window.innerWidth,320),t=performance.now()/1000;document.querySelectorAll(GL).forEach(function(el){if(el.dataset.gl)return;el.dataset.gl='1';var r=el.getBoundingClientRect();el.style.setProperty('--gd',((r.left/vw)*2-(t%7)).toFixed(2)+'s');});}
new MutationObserver(function(){if(glQ)return;glQ=1;requestAnimationFrame(function(){glQ=0;syncGlint();});}).observe(document.body,{childList:true,subtree:true});

/* ---------- persistence: videos, settings, accounts and sessions survive reloads (IndexedDB, this browser only) ---------- */
var DB=null,BLOBMAP={},lastSnap='',SEED=JSON.stringify({videos:S.videos,cfg:S.cfg});
function idbOpen(){return new Promise(function(res){try{var q=indexedDB.open('tvpro',1);q.onupgradeneeded=function(){q.result.createObjectStore('kv');};q.onsuccess=function(){res(q.result);};q.onerror=function(){res(null);};}catch(e){res(null);}});}
function kvGet(k){return new Promise(function(res){if(!DB)return res(null);try{var q=DB.transaction('kv').objectStore('kv').get(k);q.onsuccess=function(){res(q.result||null);};q.onerror=function(){res(null);};}catch(e){res(null);}});}
function kvSet(k,v){if(!DB)return;try{DB.transaction('kv','readwrite').objectStore('kv').put(v,k);}catch(e){}}
function blobUrl(f){var u=URL.createObjectURL(f),id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);BLOBMAP[u]=id;kvSet('blob:'+id,f);return u;}
function snapshot(){return JSON.stringify({v:1,theme:S.theme,skew:S.skew,session:S.session,users:S.users,videos:S.videos,cfg:S.cfg},function(k,v){return(typeof v==='string'&&BLOBMAP[v])?'idb:'+BLOBMAP[v]:v;});}
function saveNow(){var j;try{j=snapshot();}catch(e){return;}if(j===lastSnap)return;lastSnap=j;kvSet('state',j);}
function resetDemo(){var sd=JSON.parse(SEED);S.videos=sd.videos;S.cfg=sd.cfg;S.users={};S.session=null;S.skew=0;S.noticeSeen=false;S.sponsorSeen=false;saveNow();}
function restore(raw){
  if(!raw)return Promise.resolve();
  var ids=[],m,re=/"idb:([a-z0-9]+)"/g;while((m=re.exec(raw)))ids.push(m[1]);
  return Promise.all(ids.map(function(id){return kvGet('blob:'+id).then(function(b){var tok='"idb:'+id+'"';if(b){var u=URL.createObjectURL(b);BLOBMAP[u]=id;raw=raw.split(tok).join(JSON.stringify(u));}else raw=raw.split(tok).join('""');});})).then(function(){
    var o=JSON.parse(raw);
    S.theme=o.theme||'dark';S.skew=o.skew||0;S.session=o.session||null;S.users=o.users||{};
    if(o.videos)S.videos=o.videos;
    if(o.cfg)Object.keys(S.cfg).forEach(function(k){S.cfg[k]=Object.assign({},S.cfg[k],o.cfg[k]);});
  });
}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')saveNow();});
window.addEventListener('pagehide',saveNow);

/* ---------- boot ---------- */
idbOpen().then(function(d){DB=d;return kvGet('state');}).then(restore).catch(function(){}).then(function(){
  setTheme(S.theme||'dark');
  if(S.session&&S.session.email){S.user=getUser(S.session.email,!!S.session.admin);showHome();}else showLogin();
  setInterval(saveNow,1500);
});
})();
</script>

</body></html>
